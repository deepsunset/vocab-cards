<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        :root {
            --primary-color: #360F5A;
            --bg-color: #11041D;
            --accent: #A64B3D;
            --card-bg: #FDFBF7;
            --text-main: #2b2b2b;
            --correct-bg: #ebf7ee; --correct-border: #a2d9b1;
            --incorrect-bg: #fff0f0; --incorrect-border: #f5b7b7;
            --btn-bg: #EBD8F7; --btn-hover: #D4B6E6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--bg-color));
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .header { text-align: center; color: white; margin-bottom: 24px; }
        .header h1 { text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1rem; }

        .quiz-container {
            width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px;
            padding: 26px 40px 40px 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); position: relative; min-height: 420px;
        }
        /* 상단 진행 막대 */
        .qbar-wrap { height: 6px; background: #eee; border-radius: 4px; margin-bottom: 18px; overflow: hidden; }
        .qbar { height: 100%; width: 0%; background: var(--primary-color); border-radius: 4px; transition: width 0.3s; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; text-align: center; padding: 30px; overflow-y: auto;
        }
        .overlay-screen h2 { color: var(--primary-color); margin-bottom: 16px; font-size: 1.8rem; }
        .overlay-screen p { color: var(--text-main); margin-bottom: 22px; line-height: 1.5; }

        .q-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-weight: bold; color: var(--primary-color); border-bottom: 1.5px solid #e0e0e0; padding-bottom: 12px; }
        .info-right { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: #fdfdfd; border: 1px solid #ccc; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: var(--btn-bg); color: var(--primary-color); border-color: var(--primary-color); }
        .icon-btn.off { opacity: 0.4; }

        .q-badge { display: inline-block; padding: 6px 14px; background: var(--primary-color); color: white; border-radius: 8px; font-size: 0.85rem; margin-bottom: 18px; font-weight: bold; }
        .question-text { font-size: 1.25rem; font-weight: 700; line-height: 1.6; margin-bottom: 26px; word-break: keep-all; color: var(--text-main); white-space: pre-line; }

        .options { display: grid; gap: 12px; }
        .option {
            padding: 16px 18px; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer;
            transition: 0.15s; font-size: 1.1rem; background: #fff; color: #333; font-weight: 500;
            display: flex; align-items: center; gap: 12px;
        }
        .option:hover { border-color: var(--primary-color); background: #F4EFE6; }
        .option .num { display:inline-flex; align-items:center; justify-content:center; width: 26px; height: 26px; border-radius: 6px; background: #eee; color:#666; font-size: 0.9rem; font-weight:bold; flex-shrink:0; }
        .option.selected { border-color: var(--primary-color); background: #F4EFE6; }
        .option.selected .num { background: var(--primary-color); color: #fff; }
        .option.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #2d5a39 !important; font-weight: bold; }
        .option.incorrect { background: var(--incorrect-bg) !important; border-color: var(--incorrect-border) !important; color: #8a3a3a !important; font-weight: bold; }

        .input-ans { width: 100%; padding: 18px; border: 2px solid #ccc; border-radius: 12px; font-size: 1.15rem; outline: none; font-family: inherit; }
        .input-ans:focus { border-color: var(--primary-color); }

        .controls { margin-top: 30px; display: flex; gap: 12px; }
        .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn-submit { background: var(--primary-color); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-submit:hover { background: #1a062b; }
        .btn-next { background: var(--btn-bg); color: var(--primary-color); }
        .btn-next:hover { background: var(--btn-hover); }
        .btn-outline { background: #fff; color: var(--primary-color); border: 2px solid var(--primary-color); }

        .feedback-text { margin-top: 15px; font-size: 1.05rem; font-weight: bold; text-align: center; display: none; }
        .feedback-text.show { display: block; }

        /* 결과 화면 */
        .score-big { font-size: 2.2rem; font-weight: bold; color: var(--primary-color); margin-bottom: 6px; }
        .score-msg { font-size: 1.1rem; margin-bottom: 20px; }
        .review-list { width: 100%; max-width: 480px; text-align: left; margin: 6px 0 22px; max-height: 190px; overflow-y: auto; border: 1px solid #eee; border-radius: 12px; }
        .review-item { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; font-size: 0.95rem; }
        .review-item:last-child { border-bottom: none; }
        .review-item .rw { color: #c0392b; font-weight: bold; }
        .review-item .rc { color: #2d5a39; font-weight: bold; }
        .review-item .rm { color: #777; font-size: 0.85rem; }
        .result-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
        .code-box { font-family: monospace; background: #f4eef9; color: var(--primary-color); padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 16px; letter-spacing: 1px; }
        .cert-notice { color: #C0392B; font-weight: bold; font-size: 1.15rem; background: #fff0f0; padding: 15px 22px; border-radius: 12px; border: 2px dashed #f5b7b7; margin-bottom: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.03);} 100%{transform:scale(1);} }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="title">Vocabulary Quiz</h1>
        <p id="subtitle"></p>
    </div>

    <div class="quiz-container">
        <!-- 시작 화면 -->
        <div id="start-screen" class="overlay-screen">
            <h2>Ready to Start?</h2>
            <p>음성 자동 재생을 위해 아래 버튼(또는 Enter)을 눌러 시작하세요.<br>
               전체 단어를 처음부터 끝까지 <b>만점</b>으로 풀어야 인증 화면이 나옵니다.<br>
               이름을 입력하면 인증 화면에 함께 표시됩니다.</p>
            <input type="text" id="student-name" class="input-ans" placeholder="이름 (선택)" style="max-width:260px; margin-bottom:18px; text-align:center;">
            <button class="btn btn-submit" style="width: 200px;" onclick="startQuizUI()">Start Quiz</button>
        </div>

        <!-- 결과 화면 (내용은 JS가 채움) -->
        <div id="end-screen" class="overlay-screen" style="display: none;">
            <div id="end-content"></div>
        </div>

        <div class="qbar-wrap"><div id="qbar" class="qbar"></div></div>

        <div class="q-info">
            <span># <span id="q-num">1</span> / <span id="q-total">25</span></span>
            <div class="info-right">
                <span>Score: <span id="q-score">0</span></span>
                <button id="autoplay-btn" class="icon-btn" title="음성 자동재생 켜기/끄기" onclick="toggleAutoplay()">🔊</button>
                <button id="tts-btn" class="icon-btn" title="다시 듣기" onclick="speakText()">🔁</button>
            </div>
        </div>

        <div id="quiz-ui" style="display:none;">
            <div id="q-badge" class="q-badge">유형</div>
            <div id="q-text" class="question-text">Loading...</div>
            <div id="q-options" class="options"></div>
            <div id="q-input-area" style="display:none;">
                <input type="text" id="user-input" class="input-ans" placeholder="정답을 영어로 입력하세요" autocomplete="off">
            </div>
            <div id="feedback" class="feedback-text"></div>
            <div class="controls">
                <button id="btn-submit" class="btn btn-submit" onclick="checkAnswer()">정답 확인</button>
                <button id="btn-next" class="btn btn-next" style="display:none;" onclick="goNext()">다음 문제</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        /* ================= 설정/데이터 로드 (범용) ================= */
        const CFG = window.VOCAB_DATA || { title:"Vocabulary Quiz", subtitle:"", theme:{}, report:{enabled:false}, words:[] };
        (function applyTheme(){
            const t = CFG.theme || {}; const r = document.documentElement.style;
            if (t.primary)     r.setProperty('--primary-color', t.primary);
            if (t.bg)          r.setProperty('--bg-color', t.bg);
            if (t.accent)      r.setProperty('--accent', t.accent);
            if (t.button)      r.setProperty('--btn-bg', t.button);
            if (t.buttonHover) r.setProperty('--btn-hover', t.buttonHover);
        })();
        document.getElementById('title').textContent = CFG.title || "Vocabulary Quiz";
        document.getElementById('subtitle').textContent = CFG.subtitle || "";
        document.title = (CFG.title || "Vocabulary") + " Quiz";
        const rawData = CFG.words || [];
        document.getElementById('q-total').textContent = rawData.length;

        let questionBank = [];
        let currentIndex = 0;
        let score = 0;
        let selectedValue = null;
        let wrongAnswers = [];        // 개선 #3: 오답 모음
        let studentName = "";
        let isFullRun = true;         // 전체(처음~끝) 풀이 여부. '틀린 것만 풀기'면 false → 인증 불가

        /* ================= 개선 #5: 자동재생 토글(저장) + 음성 선택 ================= */
        let autoplay = localStorage.getItem('quiz::autoplay');
        autoplay = (autoplay === null) ? true : (autoplay === 'true');
        function reflectAutoplayBtn() {
            const b = document.getElementById('autoplay-btn');
            b.classList.toggle('off', !autoplay);
            b.textContent = autoplay ? '🔊' : '🔇';
        }
        function toggleAutoplay() {
            autoplay = !autoplay;
            localStorage.setItem('quiz::autoplay', autoplay);
            reflectAutoplayBtn();
            if (autoplay) speakText();
        }
        let voices = [];
        function loadVoices(){ if('speechSynthesis' in window){ voices = window.speechSynthesis.getVoices(); } }
        function pickEnglishVoice() {
            const prefer = ["Google US English", "Microsoft Aria", "Samantha", "Microsoft Zira"];
            for (const name of prefer) { const v = voices.find(x => x.name.includes(name)); if (v) return v; }
            return voices.find(v => v.lang && v.lang.toLowerCase() === 'en-us')
                || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }

        /* ================= 예문 활용형 추출 ================= */
        function extractForm(example, baseWord, inflectedOverride) {
            const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let parts = baseWord.split(' ');
            let mainWord = parts[0].toLowerCase();
            let searchWords = [mainWord];
            if (inflectedOverride) searchWords.unshift(inflectedOverride.toLowerCase()); // 불규칙 우선

            for (let word of searchWords) {
                let reg = new RegExp("\\b" + escapeRegExp(word) + "[a-z]*\\b", "i");
                let match = example.match(reg);
                if (match) {
                    let conjugatedMain = match[0].toLowerCase();
                    let rest = parts.slice(1).join(' ');
                    return rest ? conjugatedMain + ' ' + rest : conjugatedMain;
                }
            }
            return baseWord.toLowerCase();
        }
        function createBlank(example, exactWord) {
            const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let reg = new RegExp(escapeRegExp(exactWord), "gi");
            if (reg.test(example)) return example.replace(reg, '________');
            return example + " (Hint: " + exactWord + ")";
        }
        function sample(arr, n) {
            const copy = [...arr]; const out = [];
            while (copy.length && out.length < n) out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
            return out;
        }

        /* ================= 퀴즈 생성 (개선 #1 반영) ================= */
        function buildQuestionBank(words) {
            let bank = [];
            words.forEach(card => {
                const exactAns = extractForm(card.example, card.word, card.inflected);   // 활용형
                const baseAns  = card.word.toLowerCase();                                // 원형
                const blanked  = createBlank(card.example, exactAns);
                const others   = words.filter(w => w.word !== card.word);

                const types = ['fill', 'meaning', 'translate'];
                const chosenType = types[Math.floor(Math.random() * types.length)];

                if (chosenType === 'meaning') {
                    // ★개선 #1: 뜻 맞추기는 '원형'을 정답/보기로 사용 (활용형 혼란 제거)
                    let opts = [baseAns, ...sample(others, 3).map(o => o.word.toLowerCase())];
                    opts = uniqueFill(opts, others, w => w.word.toLowerCase(), baseAns);
                    bank.push({ type:'meaning', q:`다음 뜻에 해당하는 단어는?\n"${card.meaning}"`, ans:baseAns,
                                display: card.word, meaning: card.meaning, word: card.word, options: shuffle(opts) });
                } else if (chosenType === 'fill') {
                    let opts = [exactAns, ...sample(others, 3).map(o => extractForm(o.example, o.word, o.inflected))];
                    opts = uniqueFill(opts, others, w => extractForm(w.example, w.word, w.inflected), exactAns);
                    bank.push({ type:'fill', q:blanked, ans:exactAns,
                                meaning: card.meaning, word: card.word, options: shuffle(opts) });
                } else {
                    bank.push({ type:'translate', q:blanked, ans:exactAns,
                                meaning: card.meaning, word: card.word, options: [] });
                }
            });
            return shuffle(bank);
        }
        function uniqueFill(opts, pool, mapFn, answer) {
            let set = [...new Set(opts)];
            let guard = 0;
            while (set.length < 4 && guard++ < 50) {
                const cand = mapFn(pool[Math.floor(Math.random()*pool.length)]);
                if (!set.includes(cand)) set.push(cand);
            }
            if (!set.includes(answer)) set[0] = answer;
            return set.slice(0, 4);
        }
        function shuffle(a){ return a.sort(() => 0.5 - Math.random()); }

        /* ================= 진행 ================= */
        function startQuizUI() {
            studentName = (document.getElementById('student-name').value || "").trim();
            isFullRun = true;                        // 전체 단어장을 처음부터 풀기 시작
            questionBank = buildQuestionBank(rawData);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'block';
            reflectAutoplayBtn();
            // TTS 초기화(모바일)
            try { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch(e){}
            currentIndex = 0; score = 0; wrongAnswers = [];
            document.getElementById('q-score').textContent = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const data = questionBank[currentIndex];
            document.getElementById('q-num').textContent = currentIndex + 1;
            document.getElementById('q-total').textContent = questionBank.length;
            document.getElementById('qbar').style.width = ((currentIndex) / questionBank.length * 100) + "%";

            const typeName = data.type === 'fill' ? '객관식 빈칸' : (data.type === 'meaning' ? '뜻 맞추기' : '주관식 빈칸');
            document.getElementById('q-badge').textContent = typeName;
            document.getElementById('q-text').textContent = data.q;

            const optionsArea = document.getElementById('q-options');
            const inputArea = document.getElementById('q-input-area');
            const feedback = document.getElementById('feedback');
            optionsArea.innerHTML = ""; feedback.className = "feedback-text"; selectedValue = null;

            if (data.type === 'translate') {
                optionsArea.style.display = 'none';
                inputArea.style.display = 'block';
                const inp = document.getElementById('user-input');
                inp.value = ""; inp.style.cssText = ""; inp.focus();
            } else {
                optionsArea.style.display = 'grid';
                inputArea.style.display = 'none';
                data.options.forEach((opt, i) => {
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.dataset.value = opt;
                    div.innerHTML = `<span class="num">${i+1}</span><span>${opt}</span>`;
                    div.onclick = () => selectOption(div, opt);
                    optionsArea.appendChild(div);
                });
            }
            document.getElementById('btn-submit').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';
            if (autoplay) setTimeout(speakText, 300);
        }

        // 개선 #4: 보기 선택 시각화
        function selectOption(div, opt) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            div.classList.add('selected');
            selectedValue = opt;
        }

        function checkAnswer() {
            const data = questionBank[currentIndex];
            const isTranslate = data.type === 'translate';
            const userAnsRaw = isTranslate
                ? document.getElementById('user-input').value.trim().toLowerCase()
                : (selectedValue ? selectedValue.toLowerCase() : "");
            if (!userAnsRaw) return alert("답을 입력하거나 선택하세요!");

            let isCorrect;
            if (isTranslate) {
                const clean = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
                isCorrect = clean(userAnsRaw) === clean(data.ans);
            } else {
                isCorrect = userAnsRaw === data.ans.toLowerCase();
            }

            if (isCorrect) score++;
            else wrongAnswers.push({ word: data.word, meaning: data.meaning, correct: data.ans, mine: userAnsRaw });

            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');
            feedback.style.color = isCorrect ? "#2d5a39" : "var(--accent)";
            feedback.textContent = isCorrect ? "정답입니다! ✨" : `틀렸습니다. 정답: ${data.ans}`;

            if (!isTranslate) {
                document.querySelectorAll('.option').forEach(o => {
                    const val = o.dataset.value.toLowerCase();
                    if (val === data.ans.toLowerCase()) o.classList.add('correct');
                    else if (val === (selectedValue||"").toLowerCase() && !isCorrect) o.classList.add('incorrect');
                    o.onclick = null;
                });
            } else {
                const inp = document.getElementById('user-input');
                inp.style.backgroundColor = isCorrect ? "var(--correct-bg)" : "var(--incorrect-bg)";
                inp.style.borderColor = isCorrect ? "var(--correct-border)" : "var(--incorrect-border)";
                inp.style.color = isCorrect ? "#2d5a39" : "var(--accent)";
            }
            document.getElementById('q-score').textContent = score;
            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
            document.getElementById('btn-next').focus();
        }

        function goNext() {
            currentIndex++;
            if (currentIndex < questionBank.length) renderQuestion();
            else showResult();
        }

        /* ================= 결과 화면 (개선 #3 + 인증 규칙) =================
           인증 화면은 '전체(isFullRun) + 만점'일 때만 표시됩니다.
           '틀린 것만 풀기'로 만점을 받아도 인증되지 않고 전체 재도전을 안내합니다. */
        function showResult() {
            const total   = questionBank.length;
            const pct     = Math.round(score / total * 100);
            const perfect = score === total;
            const certifiable = isFullRun && perfect;

            document.getElementById('qbar').style.width = "100%";
            document.getElementById('quiz-ui').style.display = 'none';
            const c = document.getElementById('end-content');

            const reviewHtml = wrongAnswers.length ? `
                <div style="font-weight:bold; color:var(--accent); margin-bottom:6px;">틀린 단어 복습</div>
                <div class="review-list">${wrongAnswers.map(w => `
                    <div class="review-item">
                        <span class="rc">${w.word}</span> <span class="rm">(${w.meaning})</span><br>
                        내 답: <span class="rw">${w.mine || '(무응답)'}</span> → 정답: <span class="rc">${w.correct}</span>
                    </div>`).join('')}</div>` : "";

            if (certifiable) {
                // ✅ 전체 만점 → 인증 화면 (스크린샷)
                c.innerHTML = `
                    <h2>학습 완료! 🎉</h2>
                    <div class="score-big">${score} / ${total} (100점)</div>
                    <div class="score-msg">전체 단어를 처음부터 끝까지 만점으로 통과했어요!</div>
                    <div class="cert-notice">📸 [필수] 이 화면을 캡처해 선생님께 인증샷을 제출하세요!</div>
                    <div class="code-box">인증코드: ${makeVerifyCode(total)}</div>
                    <div style="font-size:0.9rem; color:#777; margin-bottom:18px;">
                        ${studentName ? studentName + ' · ' : ''}${new Date().toLocaleString('ko-KR')}
                    </div>
                    <div class="result-btns">
                        <button class="btn btn-next" onclick="location.reload()">전체 다시 풀기</button>
                    </div>`;
            } else {
                // ❌ 인증 불가 (미완성 또는 부분 풀이). 전체 재도전 안내
                let head, msg;
                if (!isFullRun) {
                    head = "복습 완료!";
                    msg = perfect
                        ? "틀린 단어를 모두 맞혔어요! 👏<br><b>인증하려면 전체 단어장을 처음부터 풀어 만점</b>을 받아야 해요."
                        : "아직 틀린 단어가 있어요. 다시 복습해 볼까요?";
                } else {
                    head = "조금 더! 💪";
                    msg = `${total}문항 중 <b>${score}개</b> 정답 (${pct}점)<br>` +
                          `인증은 <b>전체 만점</b>일 때만 가능해요. 틀린 단어를 복습하고 전체를 다시 풀어보세요!`;
                }
                c.innerHTML = `
                    <h2>${head}</h2>
                    <div class="score-big">${score} / ${total} (${pct}점)</div>
                    <div class="score-msg">${msg}</div>
                    ${reviewHtml}
                    <div class="result-btns">
                        ${wrongAnswers.length ? `<button class="btn btn-outline" onclick="retryWrong()">🔁 틀린 것만 다시 풀기(연습)</button>` : ``}
                        <button class="btn btn-submit" onclick="location.reload()">🔄 전체 처음부터 풀기 (인증 도전)</button>
                    </div>`;
            }
            document.getElementById('end-screen').style.display = 'flex';
        }

        // 오답만 다시 풀기
        function retryWrong() {
            const wrongWords = rawData.filter(c => wrongAnswers.some(w => w.word === c.word));
            if (!wrongWords.length) return;
            isFullRun = false;                       // 부분 풀이 → 인증 불가
            questionBank = buildQuestionBank(wrongWords);
            currentIndex = 0; score = 0; wrongAnswers = [];
            document.getElementById('q-score').textContent = 0;
            document.getElementById('q-total').textContent = questionBank.length;
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'block';
            renderQuestion();
        }

        // 간단 검증코드 (이름+점수+날짜 기반) — 위조 억제용
        function makeVerifyCode(total) {
            const date = new Date().toISOString().slice(0,10);
            const seed = (studentName||"anon") + "|" + score + "/" + total + "|" + date;
            let h = 0; for (let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
            return (studentName ? studentName + "-" : "") + score + "/" + total + "-" + h.toString(36).toUpperCase().slice(0,5);
        }

        /* ================= TTS ================= */
        function speakText() {
            if (!('speechSynthesis' in window)) return;
            const data = questionBank[currentIndex];
            window.speechSynthesis.cancel();
            let textToSpeak = data.type === 'meaning'
                ? "Choose the correct word for the given meaning."
                : data.q.replace(/_{2,}/g, 'blank ').replace(/[^a-zA-Z0-9\s-]/g, '');
            textToSpeak = textToSpeak.trim();
            if (!textToSpeak) return;
            const msg = new SpeechSynthesisUtterance(textToSpeak);
            msg.lang = 'en-US'; msg.rate = 0.85;
            const v = pickEnglishVoice(); if (v) msg.voice = v;
            window.speechSynthesis.speak(msg);
        }

        /* ================= 키보드 (개선 #4: 숫자키 1~4) ================= */
        window.addEventListener('keydown', function(e) {
            const startVisible = document.getElementById('start-screen').style.display !== 'none';
            const endVisible   = document.getElementById('end-screen').style.display !== 'none';
            const btnSubmit = document.getElementById('btn-submit');
            const btnNext   = document.getElementById('btn-next');

            // 숫자키로 보기 선택 (제출 전 객관식일 때만)
            if (!startVisible && !endVisible && ['1','2','3','4'].includes(e.key)) {
                if (btnSubmit.style.display !== 'none') {
                    const opts = document.querySelectorAll('.option');
                    const idx = parseInt(e.key,10) - 1;
                    if (opts[idx]) { selectOption(opts[idx], opts[idx].dataset.value); }
                    return;
                }
            }
            if (e.key === 'Enter') {
                if (startVisible) startQuizUI();
                else if (endVisible) { /* 결과 화면에선 버튼으로 조작 */ }
                else if (btnSubmit.style.display !== 'none') checkAnswer();
                else if (btnNext.style.display !== 'none') goNext();
            }
        });

        reflectAutoplayBtn();
    </script>
</body>
</html>
