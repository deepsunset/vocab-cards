<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과거분사 230문항 퀴즈</title>
<style>
  :root{
    --accent:#1F3A5F;
    --accent-dark:#16293F;
    --bg:#FFFFFF;
    --text:#1A1A1A;
    --sub:#6B7280;
    --border:#E3E6EA;
    --green:#1E7A3D;
    --green-bg:#EAF6EE;
    --red:#B3261E;
    --red-bg:#FBEAEA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:32px 16px;
  }
  .wrap{
    width:100%;
    max-width:520px;
  }
  .card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 28px;
    text-align:center;
  }
  h1{
    font-size:1.3em;
    margin:0 0 6px;
    color:var(--accent);
  }
  .subtitle{
    color:var(--sub);
    font-size:0.9em;
    margin-bottom:28px;
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85em;
    color:var(--sub);
    margin-bottom:6px;
  }
  .progress-bar{
    width:100%;
    height:8px;
    background:var(--border);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:32px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .2s ease;
  }
  .base-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }
  .base-word{
    font-size:3em;
    font-weight:700;
    color:var(--text);
  }
  .speak-btn{
    background:none;
    border:1px solid var(--border);
    border-radius:50%;
    width:44px;
    height:44px;
    font-size:1.2em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
  }
  .speak-btn:hover{background:var(--green-bg);}
  input[type=text]{
    width:100%;
    font-size:1.3em;
    padding:14px 16px;
    border:2px solid var(--border);
    border-radius:10px;
    text-align:center;
    outline:none;
    margin-bottom:16px;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .btn{
    width:100%;
    padding:14px;
    font-size:1.05em;
    font-weight:600;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{
    background:#fff;
    color:var(--accent);
    border:1px solid var(--accent);
    margin-top:10px;
  }
  .btn.secondary:hover{background:var(--green-bg);}
  .feedback{
    min-height:28px;
    font-size:1.05em;
    font-weight:600;
    margin-bottom:14px;
  }
  .feedback.correct{color:var(--green);}
  .feedback.wrong{color:var(--red);}
  .meaning-hint{
    color:var(--sub);
    font-size:0.85em;
    margin-top:-6px;
    margin-bottom:14px;
    min-height:1.2em;
  }
  .start-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .result-score{
    font-size:2.4em;
    font-weight:700;
    color:var(--accent);
    margin:10px 0 4px;
  }
  .result-detail{
    color:var(--sub);
    margin-bottom:24px;
  }
  .cert-box{
    border:2px solid var(--accent);
    border-radius:12px;
    padding:28px 20px;
    margin-bottom:22px;
  }
  .cert-title{
    font-size:1.6em;
    font-weight:700;
    color:var(--accent);
    margin-bottom:6px;
  }
  .cert-sub{
    color:var(--sub);
    font-size:0.9em;
    margin-bottom:18px;
  }
  .cert-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    text-align:left;
    margin-bottom:14px;
  }
  .cert-field label{
    font-size:0.82em;
    color:var(--sub);
  }
  .cert-field input{
    font-size:1em;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    text-align:left;
  }
  .cert-date{
    font-size:0.9em;
    color:var(--sub);
  }
  .wrong-list{
    text-align:left;
    border:1px solid var(--border);
    border-radius:10px;
    max-height:260px;
    overflow-y:auto;
    margin-bottom:20px;
  }
  .wrong-item{
    display:flex;
    justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    font-size:0.95em;
  }
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item .w-base{font-weight:600;}
  .wrong-item .w-pp{color:var(--accent);}
  .hidden{display:none !important;}
  .tts-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:0.82em;
    color:var(--sub);
    margin-top:18px;
  }
  .footer-link{
    text-align:center;
    margin-top:16px;
    font-size:0.82em;
  }
  .footer-link a{color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">

  <!-- START SCREEN -->
  <div class="card" id="screen-start">
    <h1>과거분사(p.p.) 쓰기 퀴즈</h1>
    <div class="subtitle">동사원형을 보고 과거분사를 정확히 입력하세요 (총 230문항)</div>
    <div class="start-options">
      <button class="btn" id="btn-continue">이어서 풀기</button>
      <button class="btn secondary" id="btn-start-order">처음부터 · 순서대로 시작</button>
      <button class="btn secondary" id="btn-start-shuffle">처음부터 · 섞어서 시작</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="card hidden" id="screen-quiz">
    <div class="progress-row">
      <span id="q-count">0 / 230</span>
      <span id="q-firsttry">첫 시도 정답 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="base-row">
      <div class="base-word" id="base-word">-</div>
      <button class="speak-btn" id="btn-speak" title="발음 듣기">🔊</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <input type="text" id="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="과거분사를 입력하세요">
    <div class="meaning-hint" id="meaning-hint"></div>
    <button class="btn" id="btn-submit">확인</button>
  </div>

  <!-- CERTIFICATION SCREEN -->
  <div class="card hidden" id="screen-cert">
    <div class="cert-box">
      <div class="cert-title">🎉 100점 달성</div>
      <div class="cert-sub">230문항 전체를 첫 시도에 모두 맞혔습니다</div>
      <div class="cert-field">
        <label for="cert-name">이름 (선택)</label>
        <input type="text" id="cert-name" placeholder="이름을 입력하세요">
      </div>
      <div class="cert-date" id="cert-date"></div>
    </div>
    <button class="btn secondary" id="btn-restart-cert">처음부터 다시 풀기</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="card hidden" id="screen-result">
    <h1>결과</h1>
    <div class="result-score" id="result-score">0점</div>
    <div class="result-detail" id="result-detail">0 / 230 첫 시도 정답</div>
    <div class="wrong-list" id="wrong-list"></div>
    <button class="btn" id="btn-retry-wrong">오답만 다시 풀기</button>
    <button class="btn secondary" id="btn-restart-all">처음부터 다시 풀기</button>
  </div>

  <div class="footer-link"><a href="#" id="btn-reset-all">전체 초기화</a></div>
</div>

const TOTAL = DATA.length;
const STORAGE_KEY = 'pp_quiz_v1';
const byNo = {};
DATA.forEach(d => byNo[d.no] = d);

let state = null; // loaded/created in init

function defaultState(){
  return {
    queue: DATA.map(d => d.no),
    pos: 0,
    stats: {}, // no -> {firstTry:bool|null, attempts:number, solved:bool}
    firstTryCount: 0,
    completed: false,
    mode: 'full', // 'full' | 'retry'
    retryQueue: null
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function clearState(){
  localStorage.removeItem(STORAGE_KEY);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---- screens ----
const screens = {
  start: document.getElementById('screen-start'),
  quiz: document.getElementById('screen-quiz'),
  cert: document.getElementById('screen-cert'),
  result: document.getElementById('screen-result')
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

// ---- TTS ----
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  window.speechSynthesis.speak(u);
}

// ---- quiz logic ----
let currentAttemptCountThisWord = 0;

function currentNo(){
  return state.queue[state.pos];
}

function renderQuiz(){
  const no = currentNo();
  const item = byNo[no];
  document.getElementById('base-word').textContent = item.base;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('meaning-hint').textContent = '';
  const input = document.getElementById('answer-input');
  input.value = '';
  input.disabled = false;
  input.focus();

  const total = state.mode === 'full' ? TOTAL : state.queue.length;
  document.getElementById('q-count').textContent = `${state.pos+1} / ${total}`;
  document.getElementById('q-firsttry').textContent = state.mode === 'full'
    ? `첫 시도 정답 ${state.firstTryCount}`
    : '오답 다시 풀기 모드';
  document.getElementById('progress-fill').style.width = `${((state.pos)/total)*100}%`;

  currentAttemptCountThisWord = 0;
}

function normalize(s){
  return (s||'').trim().toLowerCase();
}

function submitAnswer(){
  const input = document.getElementById('answer-input');
  const val = input.value;
  if(!val.trim()) return;
  const no = currentNo();
  const item = byNo[no];
  currentAttemptCountThisWord++;

  const correct = item.accepted_answers.some(a => normalize(a) === normalize(val));
  const feedback = document.getElementById('feedback');
  const meaningHint = document.getElementById('meaning-hint');

  if(!state.stats[no]) state.stats[no] = {firstTry:null, attempts:0, solved:false};
  state.stats[no].attempts++;

  if(correct){
    feedback.textContent = '정답입니다!';
    feedback.className = 'feedback correct';
    meaningHint.textContent = `${item.pp_display} — ${item.meaning}`;
    input.disabled = true;

    if(state.mode === 'full'){
      if(currentAttemptCountThisWord === 1 && state.stats[no].firstTry === null){
        state.stats[no].firstTry = true;
        state.firstTryCount++;
      } else if(state.stats[no].firstTry === null){
        state.stats[no].firstTry = false;
      }
    }
    state.stats[no].solved = true;
    saveState();

    speak(item.pp_display.replace(/\(.*\)/,'').trim());

    setTimeout(() => {
      advance();
    }, 900);
  } else {
    feedback.textContent = '다시 써보세요';
    feedback.className = 'feedback wrong';
    if(state.mode === 'full' && state.stats[no].firstTry === null){
      state.stats[no].firstTry = false;
    }
    saveState();
    input.value = '';
    input.focus();
  }
}

function advance(){
  state.pos++;
  if(state.pos >= state.queue.length){
    finishSession();
    return;
  }
  saveState();
  renderQuiz();
}

function finishSession(){
  if(state.mode === 'full'){
    state.completed = true;
    saveState();
    if(state.firstTryCount === TOTAL){
      showCert();
    } else {
      showResult();
    }
  } else {
    // retry session done -> back to main result view
    showResult();
  }
}

function showCert(){
  document.getElementById('cert-date').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});
  showScreen('cert');
}

function showResult(){
  const total = TOTAL;
  const firstTry = state.firstTryCount;
  let score = Math.round((firstTry/total)*100);
  if(firstTry < total) score = Math.min(99, score);
  document.getElementById('result-score').textContent = `${score}점`;
  document.getElementById('result-detail').textContent = `${firstTry} / ${total} 첫 시도 정답`;

  const wrongList = document.getElementById('wrong-list');
  wrongList.innerHTML = '';
  const wrongNos = DATA.filter(d => state.stats[d.no] && state.stats[d.no].firstTry === false).map(d => d.no);

  if(wrongNos.length === 0){
    wrongList.innerHTML = '<div class="wrong-item">틀린 단어가 없습니다.</div>';
    document.getElementById('btn-retry-wrong').classList.add('hidden');
  } else {
    document.getElementById('btn-retry-wrong').classList.remove('hidden');
    wrongNos.forEach(no => {
      const item = byNo[no];
      const row = document.createElement('div');
      row.className = 'wrong-item';
      row.innerHTML = `<span class="w-base">${item.base}</span><span class="w-pp">${item.pp_display}</span>`;
      wrongList.appendChild(row);
    });
  }
  state.lastWrongNos = wrongNos;
  showScreen('result');
}

// ---- start actions ----
function startFull(shuffleOrder){
  state = defaultState();
  state.queue = shuffleOrder ? shuffle(state.queue) : state.queue;
  saveState();
  showScreen('quiz');
  renderQuiz();
}

function continueSession(){
  const loaded = loadState();
  if(!loaded){
    startFull(false);
    return;
  }
  state = loaded;
  if(state.completed){
    if(state.firstTryCount === TOTAL){
      showCert();
    } else {
      showResult();
    }
    return;
  }
  showScreen('quiz');
  renderQuiz();
}

function startRetry(){
  const wrongNos = state.lastWrongNos || [];
  if(wrongNos.length === 0) return;
  state.mode = 'retry';
  state.queue = wrongNos;
  state.pos = 0;
  showScreen('quiz');
  renderQuiz();
}

// ---- wire up ----
document.getElementById('btn-start-order').addEventListener('click', () => startFull(false));
document.getElementById('btn-start-shuffle').addEventListener('click', () => startFull(true));
document.getElementById('btn-continue').addEventListener('click', continueSession);
document.getElementById('btn-submit').addEventListener('click', submitAnswer);
document.getElementById('answer-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitAnswer();
});
document.getElementById('btn-speak').addEventListener('click', () => {
  const no = currentNo();
  speak(byNo[no].base);
});
document.getElementById('btn-restart-cert').addEventListener('click', () => {
  clearState();
  showScreen('start');
});
document.getElementById('btn-restart-all').addEventListener('click', () => {
  clearState();
  showScreen('start');
});
document.getElementById('btn-retry-wrong').addEventListener('click', startRetry);
document.getElementById('btn-reset-all').addEventListener('click', (e) => {
  e.preventDefault();
  if(confirm('모든 진행 상황을 초기화할까요?')){
    clearState();
    showScreen('start');
  }
});

// ---- init ----
(function init(){
  const saved = loadState();
  const continueBtn = document.getElementById('btn-continue');
  if(!saved || saved.completed){
    continueBtn.classList.add('hidden');
  }
  showScreen('start');
})();
</script>
</body>
