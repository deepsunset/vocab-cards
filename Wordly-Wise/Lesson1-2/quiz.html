<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quiz</title>
<style>
:root{
  --bg:#F7EFE3; --text:#4A3324; --primary:#8B5A2B; --primary-dark:#6B4423;
  --accent:#B8763E; --card:#FFFBF4; --border:#E3D3BC;
  --correct-bg:#EEF2E3; --correct-border:#B9D193; --correct-text:#3F5A2A;
  --incorrect-bg:#FBECE8; --incorrect-border:#E3AC9B; --incorrect-text:#8A3F2E;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans KR', sans-serif;background:linear-gradient(160deg,var(--bg),#EFE2CC);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;color:var(--text);
}
.header{text-align:center;margin-bottom:26px;}
.header h1{color:var(--primary-dark);font-size:1.5rem;word-break:keep-all;}
.header p{opacity:.7;margin-top:4px;word-break:keep-all;}
.quiz-container{width:100%;max-width:600px;background:var(--card);border-radius:22px;
  padding:30px 36px 36px;box-shadow:0 16px 40px rgba(139,90,43,.18);position:relative;border:1px solid var(--border);}
.q-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-weight:bold;
  color:var(--primary-dark);border-bottom:1.5px solid var(--border);padding-bottom:14px;}
.info-right{display:flex;align-items:center;gap:14px;}
.tts-btn{background:#fff;border:1px solid var(--border);width:36px;height:36px;border-radius:50%;cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;}
.q-badge{display:inline-block;padding:6px 14px;background:var(--primary);color:#fff;border-radius:8px;
  font-size:.82rem;margin-bottom:18px;font-weight:bold;font-family:'Noto Sans KR', sans-serif;}
.question-text{font-size:1.18rem;font-weight:700;line-height:1.6;margin-bottom:28px;word-break:keep-all;text-align:justify;}
.question-text .ex{display:block;margin-top:8px;font-style:italic;font-size:1.08rem;opacity:.85;word-break:keep-all;text-align:justify;}
.options{display:grid;gap:11px;}
.option{padding:16px;border:2px solid var(--border);border-radius:14px;cursor:pointer;font-size:1.05rem;
  background:#fff;transition:.15s;}
.option:hover{border-color:var(--primary);background:#FFF8EE;}
.option.correct{background:var(--correct-bg)!important;border-color:var(--correct-border)!important;color:var(--correct-text)!important;font-weight:bold;}
.option.incorrect{background:var(--incorrect-bg)!important;border-color:var(--incorrect-border)!important;color:var(--incorrect-text)!important;font-weight:bold;}
.input-ans{width:100%;padding:16px;border:2px solid var(--border);border-radius:14px;font-size:1.1rem;
  outline:none;font-family:inherit;}
.controls{margin-top:30px;display:flex;gap:12px;}
.btn{flex:1;padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:1.05rem;cursor:pointer;
  font-family:'Noto Sans KR', sans-serif;}
.btn-submit{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(139,90,43,.3);}
.btn-next{background:var(--accent);color:#fff;}
.feedback-text{margin-top:14px;font-size:.98rem;font-weight:600;text-align:center;display:none;font-family:'Noto Sans KR', sans-serif;}
.feedback-text.show{display:block;}
.start-screen,.result-screen{text-align:center;}
.start-screen h2,.result-screen h2{color:var(--primary-dark);margin-bottom:16px;}
.start-screen p,.result-screen p{opacity:.8;margin-bottom:22px;line-height:1.6;word-break:keep-all;text-align:justify;}
.result-screen .score-big{font-size:2.6rem;font-weight:bold;color:var(--primary-dark);margin-bottom:10px;}
.cert-box{border:2px dashed var(--accent);border-radius:16px;padding:22px;margin-top:10px;background:#FFF8EE;}
</style>
</head>
<body>
  <div class="header">
    <h1 id="h-title">Vocabulary Quiz</h1>
    <p id="h-sub"></p>
  </div>
  <div class="quiz-container" id="quiz-container">
    <div class="start-screen" id="start-screen">
      <h2>퀴즈 시작</h2>
      <p>전체 단어장을 처음부터 끝까지, 한 번의 시도에서 만점을 받으면<br>학습 완료 인증 화면이 나옵니다.</p>
      <input class="input-ans" id="student-name" placeholder="이름 (선택)" style="margin-bottom:16px;">
      <button class="btn btn-submit" onclick="startQuiz()">전체 단어장 풀기 시작</button>
    </div>

    <div id="quiz-ui" style="display:none;">
      <div class="q-info">
        <span># <span id="q-num">1</span> / <span id="q-total">1</span></span>
        <div class="info-right">
          <span>점수: <span id="q-score">0</span></span>
          <button id="tts-btn" class="tts-btn" onclick="speakText()">🔊</button>
        </div>
      </div>
      <div id="q-badge" class="q-badge">유형</div>
      <div id="q-text" class="question-text">Loading...</div>
      <div id="q-options" class="options"></div>
      <div id="q-input-area" style="display:none;">
        <input type="text" id="user-input" class="input-ans" placeholder="정답을 영어로 입력하세요" autocomplete="off">
      </div>
      <div id="feedback" class="feedback-text"></div>
      <div class="controls">
        <button id="btn-submit" class="btn btn-submit" onclick="checkAnswer()">정답 확인</button>
        <button id="btn-next" class="btn btn-next" style="display:none;" onclick="goNext()">다음 문제</button>
      </div>
    </div>

    <div class="result-screen" id="result-screen" style="display:none;">
      <h2 id="result-title"></h2>
      <div class="score-big" id="result-score"></div>
      <p id="result-desc"></p>
      <div id="cert-box" class="cert-box" style="display:none;">
        <p style="margin-bottom:6px;font-weight:bold;" id="cert-name"></p>
        <p style="margin-bottom:0;">✅ 전체 단어장 만점 — 학습 완료 인증<br>이 화면을 캡처해 선생님께 제출하세요!</p>
      </div>
      <button class="btn btn-submit" style="margin-top:20px;" onclick="location.reload()">처음부터 다시 풀기</button>
      <button class="btn btn-next" id="review-btn" style="margin-top:12px;display:none;" onclick="startReview()">틀린 것만 다시 풀기 (연습)</button>
    </div>
  </div>

<script src="data.js"></script>
<script>
function applyTheme(){
  if(!window.VOCAB_DATA || !VOCAB_DATA.theme) return;
  var r=document.documentElement.style, t=VOCAB_DATA.theme;
  r.setProperty('--primary', t.primary);
  r.setProperty('--primary-dark', t.primaryDark || t.primary);
  r.setProperty('--accent', t.accent);
  r.setProperty('--bg', t.bg);
  r.setProperty('--card', t.card || '#FFFBF4');
  r.setProperty('--border', t.border || '#E3D3BC');
}
applyTheme();
document.title = 'Vocabulary Quiz - ' + (VOCAB_DATA.title||'');
document.getElementById('h-title').textContent = VOCAB_DATA.title || 'Vocabulary Quiz';
document.getElementById('h-sub').textContent = VOCAB_DATA.subtitle || '';

function normalize(w){
  if(w.senses) return w;
  return { word:w.word, senses:[{part:w.part, meaning:w.meaning, example:w.example, inflected:w.inflected}] };
}
var allWords = (VOCAB_DATA.words||[]).map(normalize);

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function makeBlank(example, word, inflected){
  var target = inflected || word;
  var re = new RegExp('\\b' + escapeRe(target) + '\\b', 'i');
  if(re.test(example)) return example.replace(re, '________');
  // fallback: try the bare word
  var re2 = new RegExp('\\b' + escapeRe(word) + '\\b', 'i');
  if(re2.test(example)) return example.replace(re2, '________');
  return null;
}
function pickOptions(correct, pool, count){
  var distinct = [];
  shuffle(pool).forEach(function(p){
    if(p && p.toLowerCase() !== correct.toLowerCase() && distinct.indexOf(p) === -1) distinct.push(p);
  });
  var opts = distinct.slice(0, count).concat([correct]);
  return shuffle(opts);
}

// 퀴즈 문항에는 품사·영어 표현처럼 정답을 간접적으로 알려주는 요소를 넣지 않는다.
// (낱말카드 쪽 원본 meaning은 그대로 두고, 퀴즈에 쓸 때만 영어 글자가 섞인 괄호를 제거한다.)
function cleanMeaning(m){
  return m.replace(/\s*\([^)]*[A-Za-z][^)]*\)/g, '').trim();
}

var allWordStrings = [];
var allAnswerStrings = [];
var allMeanings = [];
allWords.forEach(function(w){
  if(allWordStrings.indexOf(w.word)===-1) allWordStrings.push(w.word);
  w.senses.forEach(function(s){
    allAnswerStrings.push(s.inflected || w.word);
    allMeanings.push(cleanMeaning(s.meaning));
  });
});

function buildBank(){
  var bank = [];
  allWords.forEach(function(w){
    w.senses.forEach(function(s){
      var answer = s.inflected || w.word;
      var meaning = cleanMeaning(s.meaning);
      var blank = makeBlank(s.example, w.word, s.inflected);
      if(blank){
        bank.push({ type:'fill', q: blank, ans: answer,
          options: pickOptions(answer, allAnswerStrings, 3) });
        bank.push({ type:'translate', q: '[주관식] ' + blank, ans: answer, options: [] });
      }
      bank.push({ type:'meaning', q: '다음 뜻에 해당하는 단어는?\n"' + meaning + '"',
        ans: w.word, options: pickOptions(w.word, allWordStrings, 3) });
    });
    if(w.senses.length > 1){
      w.senses.forEach(function(s){
        var meaning = cleanMeaning(s.meaning);
        var ownMeanings = w.senses.map(function(x){ return cleanMeaning(x.meaning); });
        var decoyPool = allMeanings.filter(function(m){ return ownMeanings.indexOf(m) === -1; });
        var opts = shuffle(ownMeanings.slice()).concat(shuffle(decoyPool)).slice(0,4);
        if(opts.indexOf(meaning) === -1) opts[0] = meaning;
        bank.push({ type:'distinguish',
          q: '다음 문장에서 <b>' + w.word + '</b>의 뜻으로 알맞은 것은?' ,
          ex: s.example,
          ans: meaning, options: shuffle(opts) });
      });
    }
  });
  return shuffle(bank);
}

var questionBank = [];
var currentIndex = 0, score = 0, selectedValue = null, wrongList = [];
var studentName = '';
var reviewMode = false;

var STORE_KEY = 'quizProgress::' + (VOCAB_DATA.title || 'default') + '::' + (VOCAB_DATA.subtitle || '');

function saveProgress(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      questionBank: questionBank, currentIndex: currentIndex, score: score,
      wrongList: wrongList, studentName: studentName, reviewMode: reviewMode
    }));
  }catch(e){}
}
function clearProgress(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}
function loadProgress(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function startQuiz(){
  studentName = document.getElementById('student-name').value.trim();
  questionBank = buildBank();
  currentIndex = 0; score = 0; wrongList = []; reviewMode = false;
  document.getElementById('start-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-ui').style.display='block';
  document.getElementById('q-total').textContent = questionBank.length;
  document.getElementById('q-score').textContent = score;
  renderQuestion();
  saveProgress();
}
function resumeQuiz(saved){
  questionBank = saved.questionBank; currentIndex = saved.currentIndex; score = saved.score;
  wrongList = saved.wrongList || []; studentName = saved.studentName || ''; reviewMode = !!saved.reviewMode;
  document.getElementById('start-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-ui').style.display='block';
  document.getElementById('q-total').textContent = questionBank.length;
  document.getElementById('q-score').textContent = score;
  renderQuestion();
}
function startReview(){
  if(!wrongList.length) return;
  questionBank = shuffle(wrongList);
  wrongList = [];
  currentIndex = 0; score = 0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-ui').style.display='block';
  document.getElementById('q-total').textContent = questionBank.length;
  document.getElementById('q-score').textContent = score;
  reviewMode = true;
  renderQuestion();
  saveProgress();
}

function typeName(t){
  if(t==='fill') return '객관식 빈칸';
  if(t==='translate') return '주관식 빈칸';
  if(t==='meaning') return '뜻 맞추기';
  if(t==='distinguish') return '의미 구분';
  return '문제';
}

function renderQuestion(){
  var d = questionBank[currentIndex];
  document.getElementById('q-num').textContent = currentIndex+1;
  document.getElementById('q-badge').textContent = typeName(d.type);
  document.getElementById('q-text').innerHTML = d.q + (d.ex ? '<span class="ex">"' + d.ex + '"</span>' : '');

  var optionsArea = document.getElementById('q-options');
  var inputArea = document.getElementById('q-input-area');
  var feedback = document.getElementById('feedback');
  optionsArea.innerHTML=''; feedback.className='feedback-text'; selectedValue=null;

  if(d.type==='translate'){
    optionsArea.style.display='none'; inputArea.style.display='block';
    document.getElementById('user-input').value='';
  } else {
    optionsArea.style.display='grid'; inputArea.style.display='none';
    shuffle(d.options).forEach(function(opt){
      var div=document.createElement('div');
      div.className='option'; div.textContent=opt;
      div.onclick=function(){
        document.querySelectorAll('.option').forEach(function(o){o.style.borderColor='var(--border)';});
        div.style.borderColor='var(--primary)';
        selectedValue=opt;
      };
      optionsArea.appendChild(div);
    });
  }
  document.getElementById('btn-submit').style.display='block';
  document.getElementById('btn-next').style.display='none';
}

function checkAnswer(){
  var d = questionBank[currentIndex];
  var isTr = d.type==='translate';
  var userAns = isTr ? document.getElementById('user-input').value.trim().toLowerCase() : (selectedValue ? selectedValue.toLowerCase() : '');
  if(!userAns){ alert('답을 입력하거나 선택하세요!'); return; }

  var isCorrect = false;
  if(isTr){
    isCorrect = userAns === d.ans.toLowerCase() || (userAns.length>2 && d.ans.toLowerCase().indexOf(userAns)!==-1);
  } else {
    isCorrect = userAns === d.ans.toLowerCase();
  }

  if(isCorrect) score++; else wrongList.push(d);

  var feedback = document.getElementById('feedback');
  feedback.classList.add('show');
  feedback.style.color = isCorrect ? 'var(--correct-text)' : 'var(--incorrect-text)';
  feedback.textContent = isCorrect ? '정답입니다! ✨' : ('틀렸습니다. 정답: ' + d.ans);

  if(!isTr){
    document.querySelectorAll('.option').forEach(function(o){
      if(o.textContent.toLowerCase()===d.ans.toLowerCase()) o.classList.add('correct');
      else if(o.textContent===selectedValue && !isCorrect) o.classList.add('incorrect');
    });
  } else {
    var inputEl = document.getElementById('user-input');
    inputEl.style.background = isCorrect ? 'var(--correct-bg)' : 'var(--incorrect-bg)';
  }
  document.getElementById('q-score').textContent = score;
  document.getElementById('btn-submit').style.display='none';
  document.getElementById('btn-next').style.display='block';
  saveProgress();
}

function goNext(){
  currentIndex++;
  if(currentIndex < questionBank.length){ renderQuestion(); saveProgress(); }
  else finishQuiz();
}

function finishQuiz(){
  clearProgress();
  document.getElementById('quiz-ui').style.display='none';
  document.getElementById('result-screen').style.display='block';
  var total = questionBank.length;
  document.getElementById('result-score').textContent = score + ' / ' + total;
  var perfect = score === total;
  if(reviewMode){
    document.getElementById('result-title').textContent = perfect ? '복습 완료! 🎉' : '아직 틀린 단어가 있어요';
    document.getElementById('result-desc').textContent = perfect ? '틀린 단어를 모두 맞혔어요!' : '다시 복습해 볼까요?';
    document.getElementById('cert-box').style.display='none';
  } else if(perfect){
    document.getElementById('result-title').textContent = '전체 만점! 🏆';
    document.getElementById('result-desc').innerHTML = '전체 단어를 처음부터 끝까지<br>만점으로 통과했어요!';
    document.getElementById('cert-name').textContent = studentName ? (studentName + ' 학생') : '';
    document.getElementById('cert-box').style.display='block';
  } else {
    document.getElementById('result-title').textContent = '학습 완료';
    document.getElementById('result-desc').textContent = '인증하려면 전체 단어장을 처음부터 풀어 만점을 받아야 해요. 틀린 단어를 복습하고 다시 풀어보세요!';
    document.getElementById('cert-box').style.display='none';
  }
  document.getElementById('review-btn').style.display = (wrongList.length>0) ? 'block' : 'none';
}

function speakText(){
  var d = questionBank[currentIndex];
  if(d.type==='translate'){ return; }
  window.speechSynthesis.cancel();
  var textToSpeak = (d.q + ' ' + (d.ex||'')).replace(/_{2,}/g,'blank');
  textToSpeak = textToSpeak.replace(/<[^>]+>/g,'');
  textToSpeak = textToSpeak.replace(/[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/g,'');
  textToSpeak = textToSpeak.replace(/[\[\]()'"]/g,'').trim();
  if(!textToSpeak) return;
  var msg = new SpeechSynthesisUtterance(textToSpeak);
  msg.lang='en-US'; msg.rate=0.85;
  window.speechSynthesis.speak(msg);
}

document.getElementById('student-name').addEventListener('keydown', function(e){
  if(e.key==='Enter') startQuiz();
});

// Enter key advances the quiz: submits the current answer, or moves to the next question.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(document.getElementById('quiz-ui').style.display === 'none') return; // start/result screen handled elsewhere
  e.preventDefault();
  var submitBtn = document.getElementById('btn-submit');
  var nextBtn = document.getElementById('btn-next');
  if(nextBtn.style.display !== 'none') goNext();
  else if(submitBtn.style.display !== 'none') checkAnswer();
});

// Resume progress saved before an accidental navigation away.
(function(){
  var saved = loadProgress();
  if(saved && saved.questionBank && saved.questionBank.length && saved.currentIndex < saved.questionBank.length){
    resumeQuiz(saved);
  }
})();
</script>
</body>
</html>
