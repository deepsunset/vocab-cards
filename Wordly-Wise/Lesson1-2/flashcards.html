<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Flashcards</title>
<style>
:root{
  --bg:#F7EFE3; --text:#4A3324; --primary:#8B5A2B; --primary-dark:#6B4423;
  --accent:#B8763E; --card:#FFFBF4; --border:#E3D3BC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Noto Sans KR', sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;
  padding:env(safe-area-inset-top) 20px 40px;
}
.header{text-align:center;margin:28px 0 18px;}
.header h1{color:var(--primary-dark);font-size:1.7rem;word-break:keep-all;}
.card-count{font-weight:600;font-size:.95rem;opacity:.65;margin-top:4px;}
.mode-selector{display:flex;gap:8px;margin-bottom:22px;}
.mode-btn{padding:9px 18px;border:2px solid var(--primary);border-radius:50px;background:var(--card);
  color:var(--primary-dark);font-weight:bold;cursor:pointer;font-size:.88rem;font-family:inherit;}
.mode-btn.active{background:var(--primary);color:#fff;}
.card-container{perspective:1000px;width:100%;max-width:440px;min-height:380px;margin-bottom:26px;}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.23,1,.32,1);cursor:pointer;min-height:380px;}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;min-height:380px;backface-visibility:hidden;border-radius:22px;
  padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:var(--card);box-shadow:0 12px 30px rgba(139,90,43,.14);border:1px solid var(--border);
  overflow-y:auto;}
.card-back{transform:rotateY(180deg);}
.word{font-size:2.3rem;font-weight:700;color:var(--primary-dark);text-align:center;margin-bottom:6px;}
.multi-badge{font-size:.72rem;background:var(--accent);color:#fff;padding:3px 10px;border-radius:20px;margin-bottom:10px;font-family:'Noto Sans KR', sans-serif;}
.sense-block{width:100%;border-top:1.5px dashed var(--border);padding:14px 2px;text-align:center;}
.sense-block:first-of-type{border-top:none;padding-top:0;}
.sense-pos{font-size:.85rem;color:var(--accent);font-weight:bold;margin-bottom:4px;font-style:italic;}
.sense-meaning{font-size:1.3rem;font-weight:600;margin-bottom:8px;word-break:keep-all;text-align:justify;}
.sense-example{font-size:1rem;font-style:italic;opacity:.8;word-break:keep-all;line-height:1.45;text-align:justify;}
.nav-controls{display:flex;align-items:center;gap:18px;width:100%;max-width:440px;}
.nav-btn{flex:1;padding:15px;border:none;border-radius:16px;background:var(--primary);color:#fff;
  font-size:1.05rem;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(139,90,43,.3);}
.nav-btn:disabled{background:#D8C9B4;box-shadow:none;cursor:not-allowed;}
.tts-btn{position:absolute;top:18px;right:18px;background:#fff;border:1px solid var(--border);border-radius:50%;
  width:42px;height:42px;cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;}
.extra-btns{margin-top:26px;display:flex;gap:16px;}
.icon-btn{background:none;border:none;color:var(--text);opacity:.65;font-size:.88rem;cursor:pointer;
  display:flex;align-items:center;gap:5px;font-family:inherit;}
</style>
</head>
<body>
  <div class="header"><h1 id="title">단어장</h1><p class="card-count" id="counter">1 / 1</p></div>
  <div class="mode-selector">
    <button class="mode-btn active" id="mode-en" onclick="setMode('english')">영 → 한</button>
    <button class="mode-btn" id="mode-kr" onclick="setMode('korean')">한 → 영</button>
  </div>
  <div class="card-container">
    <div class="card" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div>
  <div class="nav-controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">이전</button>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">다음</button>
  </div>
  <div class="extra-btns">
    <button class="icon-btn" onclick="shuffleCards()">🔀 섞기</button>
    <button class="icon-btn" onclick="resetCards()">🔄 처음부터</button>
  </div>

<script src="data.js"></script>
<script>
function applyTheme(){
  if(!window.VOCAB_DATA || !VOCAB_DATA.theme) return;
  var r=document.documentElement.style, t=VOCAB_DATA.theme;
  r.setProperty('--primary', t.primary);
  r.setProperty('--primary-dark', t.primaryDark || t.primary);
  r.setProperty('--accent', t.accent);
  r.setProperty('--bg', t.bg);
  r.setProperty('--card', t.card || '#FFFBF4');
  r.setProperty('--border', t.border || '#E3D3BC');
}
applyTheme();
document.title = 'Smart Flashcards - ' + (VOCAB_DATA.title || '');
document.getElementById('title').textContent = VOCAB_DATA.title || '단어장';

var originalData = (VOCAB_DATA.words || []).map(function(w){
  // normalize: support either {senses:[...]} (multi-sense) or flat {part,meaning,example,inflected}
  if(w.senses) return w;
  return { word:w.word, senses:[{part:w.part, meaning:w.meaning, example:w.example, inflected:w.inflected}] };
});

var cards = originalData.slice();
var currentIndex = 0;
var currentMode = 'english';

function updateCard(){
  var card = cards[currentIndex];
  var front = document.getElementById('card-front');
  var back = document.getElementById('card-back');
  var isMulti = card.senses.length > 1;

  var sensesHtml = card.senses.map(function(s){
    return '<div class="sense-block">'
      + '<div class="sense-pos">[' + s.part + ']</div>'
      + '<div class="sense-meaning">' + s.meaning + '</div>'
      + '<div class="sense-example">"' + s.example + '"</div>'
      + '</div>';
  }).join('');

  var meaningsOnly = card.senses.map(function(s){
    return '<div class="sense-block"><div class="sense-pos">[' + s.part + ']</div><div class="sense-meaning">' + s.meaning + '</div></div>';
  }).join('');

  if(currentMode === 'english'){
    front.innerHTML = '<button class="tts-btn" onclick="event.stopPropagation(); speakCurrentWord();">🔊</button>'
      + '<div class="word">' + card.word + '</div>'
      + (isMulti ? '<div class="multi-badge">뜻 ' + card.senses.length + '개</div>' : '');
    back.innerHTML = sensesHtml;
  } else {
    front.innerHTML = '<button class="tts-btn" onclick="event.stopPropagation(); speakCurrentWord();">🔊</button>'
      + (isMulti ? '<div class="multi-badge">뜻 ' + card.senses.length + '개</div>' : '')
      + meaningsOnly;
    back.innerHTML = '<div class="word">' + card.word + '</div>' + sensesHtml;
  }

  document.getElementById('counter').textContent = (currentIndex+1) + ' / ' + cards.length;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('prev-btn').disabled = currentIndex === 0;
  document.getElementById('next-btn').disabled = currentIndex === cards.length - 1;
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('mode-en').classList.toggle('active', mode==='english');
  document.getElementById('mode-kr').classList.toggle('active', mode==='korean');
  updateCard();
}
function flipCard(){ document.getElementById('flashcard').classList.toggle('flipped'); }
function nextCard(){ if(currentIndex < cards.length-1){ currentIndex++; updateCard(); } }
function prevCard(){ if(currentIndex > 0){ currentIndex--; updateCard(); } }
function shuffleCards(){ cards.sort(function(){return Math.random()-0.5;}); currentIndex=0; updateCard(); }
function resetCards(){ cards = originalData.slice(); currentIndex=0; updateCard(); }

function speakCurrentWord(){
  var msg = new SpeechSynthesisUtterance(cards[currentIndex].word);
  msg.lang = 'en-US'; msg.rate = 0.9;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(msg);
}

document.addEventListener('keydown', function(e){
  if(e.key==='ArrowLeft') prevCard();
  if(e.key==='ArrowRight') nextCard();
  if(e.key===' '){ e.preventDefault(); flipCard(); }
  if(e.key==='v'||e.key==='V') speakCurrentWord();
});

updateCard();
</script>
</body>
</html>
