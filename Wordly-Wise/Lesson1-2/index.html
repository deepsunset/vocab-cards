<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title-tag">영어 단어 학습</title>
<style>
:root{
  --bg:#F7EFE3; --bg2:#EFE2CC; --card:#FFFBF4; --text:#4A3324;
  --primary:#8B5A2B; --primary-dark:#6B4423; --accent:#B8763E; --border:#E3D3BC;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans KR', sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;
}
.header{text-align:center;margin-bottom:36px;}
.header h1{font-size:2.1rem;color:var(--primary-dark);letter-spacing:.5px;margin-bottom:6px;word-break:keep-all;}
.header p{font-size:1.05rem;opacity:.75;word-break:keep-all;}
.cards{display:flex;flex-direction:column;gap:18px;width:100%;max-width:380px;}
.nav-card{
  display:flex;align-items:center;gap:16px;background:var(--card);
  border:1.5px solid var(--border);border-radius:18px;padding:22px 24px;
  text-decoration:none;color:var(--text);box-shadow:0 8px 22px rgba(139,90,43,0.12);
  transition:.2s;
}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(139,90,43,0.18);border-color:var(--primary);}
.nav-icon{font-size:2rem;}
.nav-text b{display:block;font-size:1.15rem;color:var(--primary-dark);margin-bottom:2px;}
.nav-text span{font-size:.9rem;opacity:.7;}
.brand{margin-top:40px;font-size:.85rem;letter-spacing:2px;opacity:.5;}
</style>
</head>
<body>
  <div class="header">
    <h1 id="main-title">영어 단어 학습</h1>
    <p id="sub-title"></p>
  </div>
  <div class="cards">
    <a class="nav-card" href="flashcards.html">
      <span class="nav-icon">🃏</span>
      <span class="nav-text"><b>낱말카드</b><span>단어를 카드로 넘기며 외우기</span></span>
    </a>
    <a class="nav-card" href="quiz.html">
      <span class="nav-icon">📝</span>
      <span class="nav-text"><b>퀴즈</b><span>전체 만점 시 학습 완료 인증</span></span>
    </a>
  </div>
  <div class="brand">SueSooEnglish</div>
  <script>
    (function(){
      var s=document.createElement('script'); s.src='data.js';
      s.onload=function(){
        if(window.VOCAB_DATA){
          document.getElementById('main-title').textContent = VOCAB_DATA.title || '영어 단어 학습';
          document.getElementById('sub-title').textContent = VOCAB_DATA.subtitle || '';
          document.getElementById('title-tag').textContent = VOCAB_DATA.title || '영어 단어 학습';
          if(VOCAB_DATA.theme){
            var r=document.documentElement.style;
            r.setProperty('--primary', VOCAB_DATA.theme.primary);
            r.setProperty('--primary-dark', VOCAB_DATA.theme.primaryDark || VOCAB_DATA.theme.primary);
            r.setProperty('--accent', VOCAB_DATA.theme.accent);
            r.setProperty('--bg', VOCAB_DATA.theme.bg);
            r.setProperty('--bg2', VOCAB_DATA.theme.bg2 || VOCAB_DATA.theme.bg);
            r.setProperty('--card', VOCAB_DATA.theme.card || '#FFFBF4');
            r.setProperty('--border', VOCAB_DATA.theme.border || '#E3D3BC');
          }
        }
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
